{% extends 'base.html' %}
{% load static %}

{% block content %}

<section class="profile-bg d-flex align-items-center justify-content-center">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-md-6">


                <div class="card bg-dark text-white p-4">

                    <h2 class="text-center mb-4">
                        Create a Profile
                    </h2>

                    <form method="POST">
                        {% csrf_token %}

                        <div class="mb-3">

                            <label class="form-label">
                                Profile Name
                            </label>

                            <input type="text" name="name" id="id_name" class="form-control" placeholder="Profile Name"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Maturity Level
                            </label>

                            <select name="age_limit" id="id_age_limit" class="form-select">

                                <option value="All">All</option>
                                <option value="Kids">Kids</option>

                            </select>

                        </div>

                        <button class="btn btn-danger w-100">
                            Create Profile
                        </button>
                        <div class="d-flex justify-content-center mt-2">
                            <a href="{% url 'Visionapp:profile-list' %}" class= " btn btn-dark m-auto text-light">back</a>
                        </div>



                    </form>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
